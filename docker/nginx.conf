server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://api-gateway:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Always serve the multi-service Swagger UI instead of falling back to the SPA.
    location = /swagger-ui {
        return 302 /swagger-ui.html;
    }

    location = /swagger-ui/ {
        return 302 /swagger-ui.html;
    }

    location = /swagger-ui/index.html {
        return 302 /swagger-ui.html;
    }

    # Serve the custom multi-service Swagger UI file directly
    location = /swagger-ui.html {
        alias /usr/share/nginx/html/swagger.html;
    }

    location /v3/api-docs/ {
        proxy_pass http://api-gateway:8080/v3/api-docs/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
