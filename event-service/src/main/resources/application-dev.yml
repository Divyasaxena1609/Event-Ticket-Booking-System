spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/event_db
    username: ${EVENT_DB_USERNAME:postgres}
    password: ${EVENT_DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

services:
  user:
    url: http://localhost:8085
