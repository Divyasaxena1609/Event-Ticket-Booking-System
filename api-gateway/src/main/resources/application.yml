server:
  port: 8080

security:
  jwt:
    # Must match auth-service; override with SECURITY_JWT_SECRET outside local development.
    secret: ${SECURITY_JWT_SECRET:VGhpcy1pcy1hLWRldmVsb3BtZW50LW9ubHktMzItYnl0ZS1rZXk=}

spring:
  application:
    name: api-gateway

  main:
    web-application-type: reactive

  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns:
              - 'http://localhost:*'
              - 'http://127.0.0.1:*'
            allowedMethods: '*'
            allowedHeaders: '*'
            allowCredentials: true
      routes:
        - id: auth-service
          uri: ${AUTH_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/auth/**

        - id: booking-service
          uri: ${BOOKING_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/booking
          filters:
            - SetPath=/bookings

        - id: booking-service-path
          uri: ${BOOKING_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/booking/**
          filters:
            - StripPrefix=1
            - PrefixPath=/bookings

        - id: payment-service
          uri: ${BOOKING_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/payment/**
          filters:
            - StripPrefix=1
            - PrefixPath=/payments

        - id: event-service
          uri: ${EVENT_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/event
          filters:
            - SetPath=/events

        - id: event-service-path
          uri: ${EVENT_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/event/**
          filters:
            - StripPrefix=1
            - PrefixPath=/events

        - id: notification-service
          uri: ${NOTIFICATION_SERVICE_URL:http://localhost:8084}
          predicates:
            - Path=/notification/**

        - id: user-service
          uri: ${USER_SERVICE_URL:http://localhost:8085}
          predicates:
            - Path=/user
          filters:
            - SetPath=/users

        - id: user-service-path
          uri: ${USER_SERVICE_URL:http://localhost:8085}
          predicates:
            - Path=/user/**
          filters:
            - StripPrefix=1
            - PrefixPath=/users


management:
  endpoints:
    web:
      exposure:
        include: health,info
