spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/auth_db
    username: ${AUTH_DB_USERNAME:postgres}
    password: ${AUTH_DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # Configure SMTP credentials through environment variables; never commit them.
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${SMTP_AUTH:true}
      mail.smtp.starttls.enable: ${SMTP_STARTTLS:true}

security:
  jwt:
    secret: ${SECURITY_JWT_SECRET}
    access-token-expiration: 15m
    refresh-token-expiration: 7d

app:
  password-reset:
    frontend-url: ${PASSWORD_RESET_FRONTEND_URL:http://localhost:5173}
    from: ${MAIL_FROM:}
    expiration: 30m
