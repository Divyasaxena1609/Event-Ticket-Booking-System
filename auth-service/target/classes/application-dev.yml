spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/auth_db
    username: postgres
    password: ${AUTH_DB_PASSWORD:Divya@1609}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # Configure these in your environment to send mail, e.g. SMTP_HOST, SMTP_PORT,
  # SMTP_USERNAME and SMTP_PASSWORD (use an app password for Gmail).
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${SMTP_AUTH:true}
      mail.smtp.starttls.enable: ${SMTP_STARTTLS:true}

security:
  jwt:
    # Replace this development-only key through SECURITY_JWT_SECRET in deployed environments.
    secret: ${SECURITY_JWT_SECRET:VGhpcy1pcy1hLWRldmVsb3BtZW50LW9ubHktMzItYnl0ZS1rZXk=}
    access-token-expiration: 15m
    refresh-token-expiration: 7d

app:
  password-reset:
    frontend-url: ${PASSWORD_RESET_FRONTEND_URL:http://localhost:5173}
    from: ${MAIL_FROM:}
    expiration: 30m
