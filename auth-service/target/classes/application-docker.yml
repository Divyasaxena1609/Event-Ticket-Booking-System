spring:
  datasource:
    url: jdbc:postgresql://auth-db:5432/auth_db
    username: auth_user
    password: auth_pass
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${SMTP_AUTH:true}
      mail.smtp.starttls.enable: ${SMTP_STARTTLS:true}

security:
  jwt:
    secret: ${SECURITY_JWT_SECRET}
    access-token-expiration: 15m
    refresh-token-expiration: 7d

app:
  password-reset:
    frontend-url: ${PASSWORD_RESET_FRONTEND_URL:http://localhost:5173}
    from: ${MAIL_FROM:}
    expiration: 30m

services:
  user:
    url: ${USER_SERVICE_URL:http://user-service:8085}
